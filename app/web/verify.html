<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your BankPop account</title>
    <!--
      The page the verification mail links to.

      It is deliberately not the Flutter app: the link has to work on a laptop
      that has never opened BankPop, and marking one address verified does not
      need a whole app to boot. This page talks to Supabase directly with the
      same publishable key the app ships, does the two writes the link is for,
      and then sends the player to the sign-in screen.

      The token in the URL is a bearer token: it is hashed here before it is
      looked up, because only the hash is stored (see supabase/email.sql). That
      is also why this page can live in the open - a copy of the URL is the only
      thing that could be used, and it expires after a day.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #fff8e1;
        color: #2c2c2c;
        font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #fff9c4;
        border-radius: 22px;
        padding: 28px 22px 22px;
        box-shadow: 0 3px 12px rgba(93, 64, 55, 0.16);
        text-align: center;
      }
      .mark {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        margin: 0 auto 14px;
        display: block;
        object-fit: cover;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.3;
        color: #33691e;
      }
      p {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.5;
        color: #558b2f;
      }
      .detail {
        font-size: 12.5px;
        color: #7cb342;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 14px auto;
        border: 3px solid #dcedc8;
        border-top-color: #689f38;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .button {
        display: block;
        margin-top: 20px;
        padding: 14px 18px;
        border-radius: 12px;
        background: #689f38;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        border: 2px solid #2c2c2c;
        box-shadow: 3px 3px 0 #2c2c2c;
      }
      .button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2c2c2c; }
      .button.secondary {
        margin-top: 10px;
        background: transparent;
        color: #2e7d32;
        border: 1px solid #689f38;
        box-shadow: none;
        font-size: 14px;
        font-weight: 600;
      }
      .icon { font-size: 46px; line-height: 1; margin-bottom: 10px; }
      .bad { color: #c62828; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="mark"
        alt="BankPop"
        src="https://res.cloudinary.com/dnsggymke/image/upload/v1793035142/play_icon_wejq6y.jpg"
      />
      <div id="icon" class="icon"></div>
      <h1 id="title">Verifying your email…</h1>
      <p id="message">One moment while we confirm this link.</p>
      <div id="spinner" class="spinner"></div>
      <p id="detail" class="detail" hidden></p>
      <a id="go" class="button" href="#" hidden></a>
      <a id="open" class="button secondary" href="#" hidden></a>
    </main>

    <script>
      // The same project and publishable key the app ships with; both are public
      // by design. Nothing secret is needed to verify a link - only the token.
      const SUPABASE_URL = "https://dgalohswapxuaayftwlj.supabase.co";
      const SUPABASE_KEY = "sb_publishable_4ynd9Wt_Hhi7bkD6O7IwsA_ns7MEK6b";

      // Where the app lives. Served from the same site as the app (Netlify, or a
      // local dev server), so the page's own origin is the app's address.
      const APP_URL = location.protocol.indexOf("http") === 0
        ? location.origin
        : "https://bankpop.netlify.app";

      const headers = {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
      };

      const icon = document.getElementById("icon");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");
      const spinner = document.getElementById("spinner");
      const go = document.getElementById("go");
      const open = document.getElementById("open");

      function show({ sign, heading, body, extra }) {
        spinner.hidden = true;
        icon.textContent = sign;
        title.textContent = heading;
        message.textContent = body;
        if (extra) {
          detail.textContent = extra;
          detail.hidden = false;
        }
      }

      function success() {
        icon.classList.remove("bad");
        show({
          sign: "✅",
          heading: "Your email is verified",
          body: "You can sign in to BankPop now. Your games stay linked to this address.",
        });
        go.textContent = "Go to the sign-in page";
        go.href = APP_URL + "/auth";
        go.hidden = false;
        open.textContent = "Open BankPop";
        open.href = APP_URL + "/";
        open.hidden = false;
      }

      function failure(heading, body, extra) {
        icon.classList.add("bad");
        show({ sign: "⚠️", heading, body, extra });
        open.textContent = "Open BankPop";
        open.href = APP_URL + "/";
        open.hidden = false;
      }

      async function sha256(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function rest(path, options) {
        const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
          ...options,
          headers: { ...headers, ...(options && options.headers) },
        });
        if (!response.ok) {
          throw new Error(
            "the account service answered HTTP " + response.status
          );
        }
        const text = await response.text();
        return text ? JSON.parse(text) : null;
      }

      async function verify() {
        const token = new URLSearchParams(location.search).get("token") || "";
        if (!token) {
          failure(
            "This link is missing its code",
            "The link was cut short on the way here. Open it again from your email, or ask for a new one."
          );
          return;
        }

        let hash;
        try {
          hash = await sha256(token);
        } catch (error) {
          failure(
            "This browser cannot check the link",
            "It needs a secure connection (https://) for that. Open the link from your email in a browser and try again."
          );
          return;
        }

        let rows;
        try {
          rows = await rest(
            "email_tokens?token_hash=eq." +
              encodeURIComponent(hash) +
              "&purpose=eq.verify&used_at=is.null" +
              "&select=id,profile_id,expires_at"
          );
        } catch (error) {
          failure(
            "Could not reach BankPop",
            "The link is fine, but the account service could not be reached. Check your connection and open the link again.",
            String(error && error.message ? error.message : error)
          );
          return;
        }

        if (!rows || rows.length === 0) {
          failure(
            "This link has already been used",
            "Each link works once. If you still cannot sign in, open BankPop and ask for a new verification email from the sign-in screen."
          );
          return;
        }

        const row = rows[0];
        const expires = Date.parse(row.expires_at || "");
        if (!isNaN(expires) && expires < Date.now()) {
          failure(
            "This link has expired",
            "Links are good for a day. Open BankPop and ask for a new verification email from the sign-in screen."
          );
          return;
        }

        const now = new Date().toISOString();
        try {
          await rest("players_profile?id=eq." + encodeURIComponent(row.profile_id), {
            method: "PATCH",
            headers: { Prefer: "return=minimal" },
            body: JSON.stringify({ verified: true, updated_at: now }),
          });
          await rest("email_tokens?id=eq." + encodeURIComponent(row.id), {
            method: "PATCH",
            headers: { Prefer: "return=minimal" },
            body: JSON.stringify({ used_at: now }),
          });
        } catch (error) {
          failure(
            "The link could not be completed",
            "The account service refused the change. Try the link once more; if it keeps failing, ask for a new verification email from the app.",
            String(error && error.message ? error.message : error)
          );
          return;
        }

        success();
      }

      verify();
    </script>
  </body>
</html>
