[project]
name = "django-mail-api"
version = "0.1.0"
description = "Small Django API that sends email for Flutter (web, Android, iOS) apps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-anymail>=15.2",
    "django-cors-headers>=4.9.0",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4",
]
