<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BankPop action icons</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg.icon { display: none; width: 512px; height: 512px; padding: 18px; box-sizing: border-box; }
  svg.icon.on { display: block; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- BankPop's money sign: the heavy-bar B, drawn once and reused. Icons
         that show money carry it instead of a dollar sign. -->
    <g id="bMark">
      <g fill="none" stroke="currentColor" stroke-width="20"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M37 16 V84" />
        <path d="M37 16 H57 C71 16 79 23 79 32 C79 41 71 48 57 48 H37" />
        <path d="M37 48 H61 C77 48 86 57 86 67 C86 77 77 84 61 84 H37" />
      </g>
      <g fill="currentColor">
        <rect x="4" y="35" width="36" height="12" rx="6" />
        <rect x="4" y="59" width="36" height="12" rx="6" />
      </g>
    </g>
  </defs>
</svg>

<svg class="icon" data-name="controls" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="41" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <circle cx="50" cy="30" r="5" fill="#22304A" />
  <rect x="46.5" y="42" width="7" height="30" rx="3.5" fill="#22304A" />
</svg>


<svg class="icon" data-name="scan" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#22304A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 30V16a6 6 0 0 1 6-6h14" />
    <path d="M70 10h14a6 6 0 0 1 6 6v14" />
    <path d="M90 70v14a6 6 0 0 1-6 6H70" />
    <path d="M30 90H16a6 6 0 0 1-6-6V70" />
  </g>
  <rect x="26" y="26" width="16" height="16" rx="3" fill="#FFF6E3" stroke="#22304A" stroke-width="4" />
  <rect x="58" y="26" width="16" height="16" rx="3" fill="#FFF6E3" stroke="#22304A" stroke-width="4" />
  <rect x="26" y="58" width="16" height="16" rx="3" fill="#FFF6E3" stroke="#22304A" stroke-width="4" />
  <rect x="58" y="58" width="6" height="6" rx="1.5" fill="#22304A" />
  <rect x="68" y="66" width="6" height="6" rx="1.5" fill="#22304A" />
  <rect x="58" y="68" width="6" height="6" rx="1.5" fill="#22304A" />
  <rect x="68" y="58" width="6" height="6" rx="1.5" fill="#22304A" />
  <rect x="8" y="45" width="84" height="10" rx="5" fill="#FFD34D" stroke="#22304A" stroke-width="4" />
</svg>

<svg class="icon" data-name="show_qr" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- The code itself: three finder patterns with their eye, then the data
       modules between them. No scan line: the yellow stripe under the code
       read as a second, unrelated mark. -->
  <rect x="16" y="14" width="68" height="68" rx="11" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <g fill="none" stroke="#22304A" stroke-width="4.6">
    <rect x="22" y="20" width="16" height="16" rx="3.5" />
    <rect x="62" y="20" width="16" height="16" rx="3.5" />
    <rect x="22" y="60" width="16" height="16" rx="3.5" />
  </g>
  <g fill="#22304A">
    <rect x="27.5" y="25.5" width="5" height="5" rx="1.4" />
    <rect x="67.5" y="25.5" width="5" height="5" rx="1.4" />
    <rect x="27.5" y="65.5" width="5" height="5" rx="1.4" />
    <rect x="44" y="22" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="22" width="4.4" height="4.4" rx="1.2" />
    <rect x="44" y="30.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="30.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="44" y="39" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="39" width="4.4" height="4.4" rx="1.2" />
    <rect x="35.5" y="44" width="4.4" height="4.4" rx="1.2" />
    <rect x="44" y="47.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="47.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="62" y="47.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="70.5" y="47.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="44" y="56" width="4.4" height="4.4" rx="1.2" />
    <rect x="62" y="56" width="4.4" height="4.4" rx="1.2" />
    <rect x="70.5" y="56" width="4.4" height="4.4" rx="1.2" />
    <rect x="44" y="64.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="64.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="62" y="64.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="70.5" y="64.5" width="4.4" height="4.4" rx="1.2" />
    <rect x="52.5" y="72" width="4.4" height="4.4" rx="1.2" />
    <rect x="62" y="72" width="4.4" height="4.4" rx="1.2" />
  </g>
</svg>

<svg class="icon" data-name="pay_bank" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M40 26l30-12 30 12z" fill="#2F5D7C" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <rect x="38" y="26" width="64" height="8" rx="4" fill="#2F5D7C" stroke="#22304A" stroke-width="4" />
  <g fill="#9FB4C9" stroke="#22304A" stroke-width="4">
    <rect x="46" y="34" width="12" height="34" rx="3" />
    <rect x="64" y="34" width="12" height="34" rx="3" />
    <rect x="82" y="34" width="7" height="34" rx="3" />
  </g>
  <rect x="40" y="68" width="60" height="10" rx="4" fill="#2F5D7C" stroke="#22304A" stroke-width="4" />
  <circle cx="24" cy="44" r="18" fill="#FFD34D" stroke="#22304A" stroke-width="5" />
  <!-- The sign is placed by its ink, not by its drawing box: 50,50 is the
       middle of everything the mark paints, so it lands dead centre with an
       even margin inside the coin. -->
  <use href="#bMark" transform="translate(12 32) scale(0.24)" color="#22304A" />
  <path d="M8 86h28" fill="none" stroke="#22304A" stroke-width="7" stroke-linecap="round" />
  <path d="M32 76l12 10-12 10" fill="none" stroke="#22304A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 76l12 10-12 10" fill="none" stroke="#FFD34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="pause" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="72" height="72" rx="20" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <rect x="35" y="32" width="11" height="36" rx="5" fill="#2F5D7C" stroke="#22304A" stroke-width="3.4" />
  <rect x="54" y="32" width="11" height="36" rx="5" fill="#2F5D7C" stroke="#22304A" stroke-width="3.4" />
</svg>

<svg class="icon" data-name="resume" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="72" height="72" rx="20" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <path d="M40 31l28 19-28 19z" fill="#5C8A3A" stroke="#22304A" stroke-width="4" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="advance" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="20" width="64" height="40" rx="8" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <!-- Centred in the note: the mark's ink is 100 units wide, so 50,50 maps to
       the note's own middle at 40,40. -->
  <use href="#bMark" transform="translate(25 25) scale(0.30)" color="#22304A" />
  <path d="M16 84h44" fill="none" stroke="#22304A" stroke-width="7" stroke-linecap="round" />
  <path d="M54 72l14 12-14 12" fill="none" stroke="#22304A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M54 72l14 12-14 12" fill="none" stroke="#FFD34D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="remove_player" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="46" cy="32" r="16" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <path d="M16 82c0-16 13-26 30-26s30 10 30 26z" fill="#9FB4C9" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <circle cx="76" cy="72" r="17" fill="#B23A32" stroke="#22304A" stroke-width="4" />
  <rect x="68" y="69" width="16" height="6" rx="3" fill="#FFF6E3" />
</svg>

<svg class="icon" data-name="restore_player" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="46" cy="32" r="16" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <path d="M16 82c0-16 13-26 30-26s30 10 30 26z" fill="#9FB4C9" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <circle cx="76" cy="72" r="17" fill="#5C8A3A" stroke="#22304A" stroke-width="4" />
  <!-- A circular arrow, so the badge says "bring back" rather than drawing a
       second plus beside the minus on the remove button. The arc is a dashed
       circle: 250 degrees of it, with the head filling the gap. -->
  <circle cx="76" cy="72" r="8.4" fill="none" stroke="#FFF6E3" stroke-width="4.6"
          stroke-dasharray="36.65 16.13" transform="rotate(90 76 72)" />
  <path d="M89.0 67.3 L78.8 71.0 L84.3 73.5 Z" fill="#FFF6E3" />
</svg>

<svg class="icon" data-name="end_game" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M30 10v80" fill="none" stroke="#22304A" stroke-width="8" stroke-linecap="round" />
  <path d="M30 14h34a16 16 0 0 1 0 32H30z" fill="#B23A32" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <path d="M38 24h18M38 34h12" stroke="#FFF6E3" stroke-width="4.5" stroke-linecap="round" />
  <path d="M14 90h34" fill="none" stroke="#22304A" stroke-width="8" stroke-linecap="round" />
</svg>

<svg class="icon" data-name="hand_over" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Two arrows chasing each other round the money: the bank changing hands.
       Each arc is 140 degrees of a dashed circle, so the pair is symmetrical
       and the heads sit in the gaps. -->
  <g fill="none" stroke="#22304A" stroke-width="7" stroke-dasharray="68.07 120.43">
    <circle cx="50" cy="51" r="30" transform="rotate(160 50 51)" />
    <circle cx="50" cy="51" r="30" transform="rotate(340 50 51)" />
  </g>
  <g fill="#22304A">
    <path d="M63.3 14.4 L57.2 31.3 L70.8 29.4 Z" />
    <path d="M36.7 87.6 L42.8 70.7 L29.2 72.6 Z" />
  </g>
  <circle cx="50" cy="51" r="17" fill="#FFD34D" stroke="#22304A" stroke-width="4.5" />
  <use href="#bMark" transform="translate(37 38) scale(0.26)" color="#22304A" />
</svg>

<svg class="icon" data-name="share_board" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M22 62v10a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V62" fill="none" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
  <path d="M50 60V24" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
  <path d="M32 36l18-18 18 18" fill="none" stroke="#22304A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 36l18-18 18 18" fill="none" stroke="#FFD34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="download_board" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M22 62v10a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V62" fill="none" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
  <path d="M50 16v40" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
  <path d="M32 40l18 18 18-18" fill="none" stroke="#22304A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 40l18 18 18-18" fill="none" stroke="#FFD34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="new_board" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="12" width="60" height="60" rx="11" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <g fill="#9FB4C9">
    <rect x="19" y="21" width="17" height="17" rx="4" />
    <rect x="43" y="21" width="17" height="17" rx="4" />
    <rect x="19" y="45" width="17" height="17" rx="4" />
    <rect x="43" y="45" width="17" height="17" rx="4" />
  </g>
  <circle cx="76" cy="76" r="19" fill="#FFD34D" stroke="#22304A" stroke-width="5" />
  <path d="M76 66v20M66 76h20" fill="none" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
</svg>

<svg class="icon" data-name="import_board" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="10" width="56" height="68" rx="10" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <path d="M26 26h32M26 38h20" stroke="#9FB4C9" stroke-width="6" stroke-linecap="round" />
  <circle cx="70" cy="70" r="21" fill="#5C8A3A" stroke="#22304A" stroke-width="5" />
  <path d="M70 59v16M61 68l9 9 9-9" fill="none" stroke="#FFF6E3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="paste" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="22" y="16" width="56" height="70" rx="10" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <rect x="36" y="8" width="28" height="18" rx="7" fill="#9FB4C9" stroke="#22304A" stroke-width="5" />
  <path d="M36 46h26M36 58h28M36 70h16" stroke="#FFD34D" stroke-width="6" stroke-linecap="round" />
</svg>

<svg class="icon" data-name="open_file" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M10 34a8 8 0 0 1 8-8h16l9 10h39a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8z" fill="#9FB4C9" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <path d="M50 76V50" stroke="#22304A" stroke-width="6" stroke-linecap="round" />
  <path d="M37 61l13-13 13 13" fill="none" stroke="#22304A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M37 61l13-13 13 13" fill="none" stroke="#FFD34D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg class="icon" data-name="support" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 32a12 12 0 0 1 12-12h52a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12H44L24 88V70h0a12 12 0 0 1-12-12z" fill="#FFF6E3" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <path d="M41 36c0-6 4.2-10 9.6-10S60 29.6 60 35c0 6.2-9 7-9 14" fill="none" stroke="#22304A" stroke-width="6.5" stroke-linecap="round" />
  <circle cx="51" cy="58" r="4" fill="#22304A" />
  <circle cx="78" cy="22" r="8" fill="#FFD34D" stroke="#22304A" stroke-width="4" />
</svg>

<svg class="icon" data-name="camera" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="28" width="84" height="56" rx="13" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <path d="M33 28l8-11h18l8 11" fill="#9FB4C9" stroke="#22304A" stroke-width="5" stroke-linejoin="round" />
  <circle cx="48" cy="56" r="17" fill="#9FB4C9" stroke="#22304A" stroke-width="5" />
  <circle cx="48" cy="56" r="7.5" fill="#22304A" />
  <circle cx="76" cy="40" r="4.5" fill="#FFD34D" stroke="#22304A" stroke-width="3" />
</svg>

<svg class="icon" data-name="keypad" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="14" width="80" height="72" rx="13" fill="#FFF6E3" stroke="#22304A" stroke-width="5" />
  <g fill="#22304A">
    <circle cx="32" cy="36" r="6" />
    <circle cx="50" cy="36" r="6" />
    <circle cx="68" cy="36" r="6" />
    <circle cx="32" cy="54" r="6" />
    <circle cx="50" cy="54" r="6" />
    <circle cx="68" cy="54" r="6" />
    <circle cx="32" cy="72" r="6" />
    <circle cx="50" cy="72" r="6" />
  </g>
  <circle cx="68" cy="72" r="8" fill="#FFD34D" stroke="#22304A" stroke-width="3.5" />
</svg>

<script>
  const wanted = (location.hash || '').replace('#', '');
  for (const el of document.querySelectorAll('svg.icon')) {
    if (el.dataset.name === wanted) el.classList.add('on');
  }
</script>
</body>
</html>
